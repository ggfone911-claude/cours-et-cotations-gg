name: Publication du site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'data/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
  # Appelé à la fin des relevés : un push fait avec GITHUB_TOKEN ne
  # déclenche pas d'autre workflow.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Mêmes tests que tests.yml, sur la version qui va être publiée :
  # en cas d'échec, le site en ligne garde la version précédente.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: main

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Toujours la dernière version de main, y compris le commit de données
      # que le relevé vient de pousser.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Copie des données dans le site
        run: |
          mkdir -p site/data
          if compgen -G "data/*.json" > /dev/null; then cp data/*.json site/data/; fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
