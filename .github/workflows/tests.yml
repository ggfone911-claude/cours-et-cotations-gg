name: Tests

on:
  push:
  pull_request:
  # Appelé par la publication : le site n'est mis en ligne que si les tests passent.
  workflow_call:
    inputs:
      ref:
        description: Version à tester (vide = celle qui a déclenché le run)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation de pytest
        run: pip install -r requirements.txt

      - name: Tests Python
        run: pytest -q

      - name: Validation des données
        run: python scripts/validate.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests JavaScript
        run: node --test tests/js
