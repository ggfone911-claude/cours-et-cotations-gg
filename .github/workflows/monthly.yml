name: Historique mensuel des VL

on:
  schedule:
    - cron: '0 7 1 * *'     # le 1er de chaque mois, 7 h UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  historique:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # En cas d'échec, history.json n'est pas modifié ; seul status.json
      # l'est, puis le run est mis en échec à la dernière étape.
      - name: Historique Boursorama
        id: historique
        run: |
          set +e
          python scripts/scrape_history.py
          echo "code=$?" >> "$GITHUB_OUTPUT"

      - name: Validation des données
        run: python scripts/validate.py

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/status.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
            exit 0
          fi
          jour="$(TZ=Europe/Paris date '+%d/%m/%Y')"
          if [ "${{ steps.historique.outputs.code }}" = "0" ]; then
            git commit -m "Historique mensuel — ${jour}"
          else
            git commit -m "Historique mensuel en échec — ${jour}"
          fi
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Résultat de l'historique
        if: steps.historique.outputs.code != '0'
        run: |
          echo "::error::Historique en échec : history.json inchangé (voir data/status.json)"
          exit 1

  publication:
    needs: historique
    if: ${{ !cancelled() }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
